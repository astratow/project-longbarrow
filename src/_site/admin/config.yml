backend:
  name: github
  repo: astratow/project-longbarrow  # TODO: Change to your GitHub repo
  branch: netlify-cms

media_folder: "assets"
public_folder: "/assets"

collections:
  - name: "pages"
    label: "Pages"
    files:
      - label: "Home"
        name: "home"
        file: "index.html"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Hero Headline", name: "hero_headline", widget: "string" }
